{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
  <header>
    <p class="eyebrow">Password reset</p>
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your email and we'll send a reset link, valid for 1 hour.</p>
  </header>
  <div class="card">
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required autofocus>
      <div style="margin-top:16px;"><button type="submit">Send reset link</button></div>
    </form>
  </div>
  <p class="sub" style="margin-top:16px;"><a href="{{ url_for('login') }}">Back to log in</a></p>
{% endblock %}
