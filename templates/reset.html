{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
  <header>
    <p class="eyebrow">Password reset</p>
    <h1>Set a new password</h1>
  </header>
  <div class="card">
    <form method="post" action="{{ url_for('reset_password', token=token) }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label for="password">New password (8 to 128 characters)</label>
      <input type="password" id="password" name="password" minlength="8" maxlength="128" required autofocus autocomplete="new-password">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" minlength="8" maxlength="128" required autocomplete="new-password">
      <div style="margin-top:16px;"><button type="submit">Update password</button></div>
    </form>
  </div>
{% endblock %}
