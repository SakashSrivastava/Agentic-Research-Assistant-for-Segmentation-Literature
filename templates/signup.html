{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block wrapclass %}narrow{% endblock %}

{% block content %}
  <header>
    <p class="eyebrow">Get started</p>
    <h1>Create an account</h1>
    <p class="sub">Save your searches and revisit past answers.</p>
  </header>

  <div class="card">
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required autofocus>
      <label for="password">Password <span style="text-transform:none;letter-spacing:0;">(at least 8 characters)</span></label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>
      <div style="margin-top:18px;"><button type="submit">Create account</button></div>
    </form>
  </div>
  <p class="sub" style="margin-top:16px;">Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
