# Azure VM deployment: pulls the pre-built self-contained image from a registry and
# serves it behind Caddy (automatic HTTPS via Let's Encrypt). Reads config from .env.
#   docker compose up -d
services:
  web:
    image: ${IMAGE:?set IMAGE=<registry-user>/seg-lit-assistant:latest in .env}
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      HTTPS_ONLY: "true"                     # Caddy terminates TLS and sets X-Forwarded-Proto
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}  # flip to true once SMTP works
      USER_DB_PATH: /app/userdata/users.db
      # Real email delivery (verification + password reset). Leave unset to fall back
      # to showing the link in-app. For Gmail: host smtp.gmail.com, port 587, and a
      # 16-char App Password (not your account password) as SMTP_PASSWORD.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - userdata:/app/userdata               # accounts + history persist on the VM disk
    expose:
      - "5000"                               # internal only; Caddy is the public entrypoint

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN=<your-sub>.duckdns.org in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  userdata:
  caddy_data:
  caddy_config:
